name: M0 quality gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Report Swift toolchain
        run: swift --version

      - name: Swift unit, localization, layout, and privacy tests
        run: swift test

      - name: M3 100,000-track cold-display and search budgets
        run: >-
          env ONGAKU_ENFORCE_M3_PERFORMANCE=1
          swift test --filter m3PerformanceGate

      - name: Compile macOS UI and accessibility audits
        run: >-
          xcodebuild build-for-testing
          -project OngakuDesktop.xcodeproj
          -scheme OngakuDesktop
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Compile Mac App Store sandbox variant
        run: >-
          xcodebuild build
          -project OngakuDesktop.xcodeproj
          -scheme OngakuDesktopAppStore
          -configuration Release
          -destination 'generic/platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/OngakuDesktop-AppStore"
          CODE_SIGNING_ALLOWED=NO

      - name: Verify Mac App Store variant excludes private updater
        run: |
          STORE_APP="$RUNNER_TEMP/OngakuDesktop-AppStore/Build/Products/Release/OngakuDesktop.app"
          STORE_EXECUTABLE="$STORE_APP/Contents/MacOS/OngakuDesktop"
          test -x "$STORE_EXECUTABLE"
          test ! -d "$STORE_APP/Contents/Frameworks/Sparkle.framework"
          ! otool -L "$STORE_EXECUTABLE" | grep -q Sparkle
          ! /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$STORE_APP/Contents/Info.plist" >/dev/null 2>&1
          ! /usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$STORE_APP/Contents/Info.plist" >/dev/null 2>&1

      - name: Verify Mac App Store sandbox uses minimum network access
        run: |
          STORE_ENTITLEMENTS="Packaging/OngakuDesktopAppStore.entitlements"
          test "$(plutil -extract 'com\.apple\.security\.network\.client' raw -o - "$STORE_ENTITLEMENTS")" = "true"
          ! /usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.server' "$STORE_ENTITLEMENTS" >/dev/null 2>&1

      - name: iOS companion compile gate
        run: >-
          xcodebuild build
          -project OngakuDesktop.xcodeproj
          -target OngakuMobile
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
