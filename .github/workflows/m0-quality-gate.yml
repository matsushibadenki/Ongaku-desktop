name: M0 quality gate

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Report Swift toolchain
        run: swift --version

      - name: Swift unit, localization, layout, and privacy tests
        run: swift test

      - name: M3 100,000-track cold-display and search budgets
        run: >-
          env ONGAKU_ENFORCE_M3_PERFORMANCE=1
          swift test --filter m3PerformanceGate

      - name: Compile macOS UI and accessibility audits
        run: >-
          xcodebuild build-for-testing
          -project OngakuDesktop.xcodeproj
          -scheme OngakuDesktop
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: iOS companion compile gate
        run: >-
          xcodebuild build
          -project OngakuDesktop.xcodeproj
          -target OngakuMobile
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
